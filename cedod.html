<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cedod Wiki</title>

<!-- WEBSITE ICON -->

<link rel="icon"
type="image/png"
href="images/cedodicon.png">

<style>

/* BODY */

body{
    margin:0;
    background:black;
    font-family:Arial;
    color:red;
    text-align:center;
}

/* TITLE */

.title{
    font-size:90px;
    color:red;
    margin-top:30px;
}

/* IMAGE */

.main-image{
    width:150px;
    margin-top:20px;
    border:3px solid red;
}

/* RED LINE */

.line{
    width:100%;
    height:18px;
    background:red;
    margin-top:40px;
}

/* SMALL TEXT */

.back{
    text-align:left;
    margin-left:30px;
    margin-top:30px;
    font-size:28px;
}

/* STORY */

.story{
    margin-top:150px;
    font-size:70px;
    line-height:1.5;
}

/* MOBILE */

@media(max-width:700px){

    .title{
        font-size:55px;
    }

    .story{
        font-size:40px;
    }

}

</style>

</head>

<body>

<!-- TITLE -->

<div class="title">

    Cedod wiki

</div>

<!-- IMAGE -->

<img
src="images/cedod.png"
class="main-image">

<!-- RED LINE -->

<div class="line"></div>

<!-- BACK TEXT -->

<div class="back">

    Came back to asr wiki

</div>

<!-- STORY -->

<div class="story">

    Cedod is a good girl in tiktok

</div>

</body>

</html>

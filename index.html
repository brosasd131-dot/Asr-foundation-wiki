<!DOCTYPE html>
<html lang="en">

<head>
    <title>ASR Wiki</title>

<link rel="icon"
type="image/png"
href="favicon.png">
    
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ASR Wiki</title>

<style>

/* ========================= */
/* BODY */
/* ========================= */

body{
    margin:0;
    font-family:Arial;
    background:black;
    color:white;
}

/* ========================= */
/* TOP BAR */
/* ========================= */

.topbar{
    background:#8b0000;
    color:white;
    padding:20px;
    font-size:32px;
    font-weight:bold;
    border-bottom:3px solid red;
}

/* ========================= */
/* MAIN LAYOUT */
/* ========================= */

.container{
    display:flex;
}

/* ========================= */
/* SIDEBAR */
/* ========================= */

.sidebar{
    width:250px;
    background:#111;
    height:100vh;
    padding:15px;
    box-sizing:border-box;
    border-right:2px solid red;
}

/* ========================= */
/* MENU BUTTONS */
/* ========================= */

.sidebar a{
    display:block;
    text-decoration:none;
    background:red;
    color:white;
    padding:14px;
    margin-bottom:12px;
    border-radius:10px;
    font-size:17px;
    transition:0.3s;
}

.sidebar a:hover{
    background:#cc0000;
    transform:scale(1.03);
}

/* ========================= */
/* CONTENT */
/* ========================= */

.content{
    flex:1;
    padding:25px;
    box-sizing:border-box;
}

/* ========================= */
/* SEARCH */
/* ========================= */

.search{
    width:100%;
    padding:14px;
    background:#111;
    color:white;
    border:2px solid red;
    border-radius:10px;
    font-size:16px;
    margin-bottom:20px;
    box-sizing:border-box;
}

/* ========================= */
/* ARTICLE BOX */
/* ========================= */

.article{
    background:#111;
    padding:25px;
    border-radius:15px;
    border:2px solid red;
    line-height:1.8;
    font-size:18px;
}

/* ========================= */
/* HEADINGS */
/* ========================= */

h1{
    color:red;
}

/* ========================= */
/* MOBILE */
/* ========================= */

@media(max-width:700px){

    .container{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        height:auto;
    }

}

</style>

</head>

<body>

<!-- ========================= -->
<!-- TOP BAR -->
<!-- ========================= -->

<div class="topbar">

    ASR WIKI

</div>

<!-- ========================= -->
<!-- MAIN -->
<!-- ========================= -->

<div class="container">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <a href="index.html">

            Home

        </a>

        <a href="cedod.html">

            Cedod Wiki

        </a>

        <a href="#">

            Games

        </a>

        <a href="#">

            Technology

        </a>

    </div>

    <!-- CONTENT -->

    <div class="content">

        <!-- SEARCH -->

        <input
        type="text"
        class="search"
        placeholder="Search ASR Wiki...">

        <!-- ARTICLE -->

        <h1>Welcome To ASR Wiki</h1>

        <div class="article">

            This is the home page
            of your custom wiki website.

            <br><br>

            Features:
            <br><br>

            • Red buttons
            <br>
            • Black background
            <br>
            • Multiple HTML pages
            <br>
            • Local images
            <br>
            • Mobile support

            <br><br>

            Click "Cedod Wiki"
            in the menu to open
            the Cedod article page.

        </div>

    </div>

</div>

</body>

  </html>
